<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Content IP Radar — 콘텐츠 IP 뉴스 레이더</title>

  <style>
    :root {
      --paper: #f6f4ef;
      --card: #ffffff;
      --ink: #1f1e1b;
      --soft: #6d6a63;
      --faint: #96938b;
      --line: #e5e2da;
      --line-dark: #c9c5ba;
      --accent: #8e2f2a;
      --accent-deep: #6f221f;
      --gold: #b9822e;
      --ok: #2f7d4f;
      --err: #b3261e;
      --info: #2f5d8a;
      --serif: Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
              "Malgun Gothic", "Segoe UI", sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    select {
      cursor: pointer;
    }

    .wrap {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .masthead {
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }

    .masthead-inner {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding: 28px 0 20px;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .brand-mark::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 3px rgba(185, 130, 46, .16);
    }

    h1 {
      padding-bottom: 8px;
      border-bottom: 3px double var(--line-dark);
      font-family: var(--serif);
      font-size: clamp(26px, 4vw, 36px);
    }

    .tagline {
      max-width: 560px;
      padding-bottom: 9px;
      color: var(--soft);
      font-size: 12.5px;
      line-height: 1.6;
      text-align: right;
    }

    .nav {
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      display: flex;
      gap: 22px;
      overflow-x: auto;
    }

    .nav button {
      flex: 0 0 auto;
      padding: 13px 2px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--soft);
      font-weight: 700;
    }

    .nav button.active {
      border-bottom-color: var(--accent);
      color: var(--ink);
    }

    .meta-line {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding-top: 16px;
      color: var(--soft);
      font-size: 12px;
    }

    .refresh,
    .brief-button,
    .more {
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      background: var(--card);
      color: var(--ink);
      font-weight: 700;
    }

    .refresh {
      padding: 7px 12px;
    }

    .refresh:hover,
    .brief-button:hover,
    .more:hover {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .status-panel {
      margin-top: 16px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      background: var(--card);
    }

    .status-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--line);
      color: var(--soft);
      font-size: 11px;
      font-weight: 800;
    }

    .status-badge.ok {
      background: rgba(47, 125, 79, .12);
      color: var(--ok);
    }

    .status-badge.err {
      background: rgba(179, 38, 30, .12);
      color: var(--err);
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .status-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .status-label {
      color: var(--soft);
      font-size: 11.5px;
    }

    .status-value {
      font-weight: 800;
      font-size: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin-top: 12px;
      border: 1px solid var(--line);
      background: var(--card);
    }

    .stat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 17px 20px;
      border-right: 1px solid var(--line);
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat-label {
      color: var(--soft);
      font-size: 12.5px;
    }

    .stat-number {
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 800;
    }

    .filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--card);
    }

    .search {
      flex: 1;
      min-width: 220px;
      padding: 10px 12px;
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      background: var(--paper);
      color: var(--ink);
    }

    .search:focus,
    select:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }

    select {
      padding: 9px 10px;
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      background: var(--card);
      color: var(--ink);
      font-weight: 700;
    }

    .result-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 2px 2px;
      color: var(--soft);
      font-size: 12.5px;
    }

    .result-line b {
      color: var(--ink);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 25px 2px 12px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 800;
    }

    .section-title::before {
      content: "";
      width: 5px;
      height: 21px;
      background: var(--accent);
    }

    .brief-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brief-button {
      padding: 8px 12px;
    }

    .brief-box {
      display: none;
      margin-bottom: 4px;
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      background: var(--card);
      line-height: 1.85;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 11px;
      padding: 18px;
      border: 1px solid var(--line);
      background: var(--card);
      transition: .15s;
    }

    .card:hover {
      border-color: var(--line-dark);
      box-shadow: 0 4px 14px rgba(31, 30, 27, .07);
    }

    .badges {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      padding: 3px 8px;
      border: 1px solid var(--accent);
      border-radius: 3px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
    }

    .badge.fresh {
      border-color: var(--gold);
      color: var(--gold);
    }

    .badge.badge-official {
      border-color: var(--ok);
      color: var(--ok);
    }

    .badge.badge-news {
      border-color: var(--accent);
      color: var(--accent);
    }

    .badge.badge-industry {
      border-color: var(--gold);
      color: var(--gold);
    }

    .badge.badge-community {
      border-color: var(--info);
      color: var(--info);
    }

    .card h2 {
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.48;
    }

    .card h2 a:hover {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .summary {
      flex: 1;
      display: -webkit-box;
      overflow: hidden;
      color: var(--soft);
      font-size: 12.5px;
      line-height: 1.7;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 11px;
      border-top: 1px solid var(--line);
    }

    .source {
      overflow: hidden;
      color: var(--soft);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .visit {
      flex: 0 0 auto;
      padding: 7px 11px;
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      background: var(--card);
      font-size: 12px;
      font-weight: 800;
    }

    .visit:hover {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .notice {
      grid-column: 1 / -1;
      padding: 60px 24px;
      border: 1px dashed var(--line-dark);
      background: var(--card);
      color: var(--soft);
      line-height: 1.8;
      text-align: center;
    }

    .more {
      display: none;
      width: 100%;
      margin: 16px 0 30px;
      padding: 12px;
    }

    .skeleton {
      min-height: 250px;
      border: 1px solid var(--line);
      background:
        linear-gradient(90deg, #eceade 25%, #f7f5ef 50%, #eceade 75%);
      background-size: 200% 100%;
      animation: shimmer 1.3s infinite;
    }

    @keyframes shimmer {
      to {
        background-position: -200% 0;
      }
    }

    footer {
      margin-top: 32px;
      padding: 27px 20px;
      border-top: 1px solid var(--line);
      background: var(--card);
      color: var(--soft);
      font-size: 12.5px;
      line-height: 1.8;
      text-align: center;
    }

    footer strong {
      color: var(--ink);
      font-family: var(--serif);
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat:nth-child(2) {
        border-right: 0;
      }

      .stat:nth-child(-n+2) {
        border-bottom: 1px solid var(--line);
      }

      .status-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 620px) {
      .wrap {
        width: min(100% - 24px, 1180px);
      }

      .masthead-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .tagline {
        text-align: left;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .result-line,
      .section-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .status-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <div>
        <div class="brand-mark">IP Radar</div>
        <h1>Content IP Radar</h1>
      </div>

      <p class="tagline">
        콘텐츠 IP · 스톡 미디어 · AI 제작 생태계의 주요 뉴스를
        한곳에 모은 뉴스 레이더
      </p>
    </div>
  </header>

  <nav class="nav">
    <div class="wrap nav-inner" id="category-nav"></div>
  </nav>

  <main class="wrap">
    <section class="status-panel" id="status-panel">
      <div class="status-head">
        <div class="section-title">시스템 상태</div>
        <span class="status-badge" id="status-badge">확인 중…</span>
      </div>

      <div class="status-grid">
        <div class="status-item">
          <span class="status-label">Supabase 연결</span>
          <span class="status-value" id="status-supabase">확인 중…</span>
        </div>

        <div class="status-item">
          <span class="status-label">저장된 기사 수</span>
          <span class="status-value" id="status-total">—</span>
        </div>

        <div class="status-item">
          <span class="status-label">최근 수집 시간</span>
          <span class="status-value" id="status-last-collected">—</span>
        </div>

        <div class="status-item">
          <span class="status-label">자동수집</span>
          <span class="status-value">매일 오전 9시대 실행</span>
        </div>

        <div class="status-item">
          <span class="status-label">마지막 상태 확인</span>
          <span class="status-value" id="status-checked">—</span>
        </div>
      </div>
    </section>

    <div class="meta-line">
      <span>업데이트 <span id="updated">—</span></span>
      <button class="refresh" id="refresh">↻ 새로고침</button>
    </div>

    <section class="stats">
      <div class="stat">
        <span class="stat-label">전체 기사</span>
        <span class="stat-number" id="stat-total">—</span>
      </div>

      <div class="stat">
        <span class="stat-label">최근 24시간</span>
        <span class="stat-number" id="stat-fresh">—</span>
      </div>

      <div class="stat">
        <span class="stat-label">뉴스 출처</span>
        <span class="stat-number" id="stat-sources">—</span>
      </div>

      <div class="stat">
        <span class="stat-label">카테고리</span>
        <span class="stat-number" id="stat-categories">—</span>
      </div>
    </section>

    <section class="filters">
      <input
        class="search"
        id="search"
        type="search"
        placeholder="제목, 요약, 출처 검색"
        aria-label="기사 검색"
      >

      <select id="period" aria-label="기간 선택">
        <option value="all">전체 기간</option>
        <option value="day">최근 24시간</option>
        <option value="week">최근 7일</option>
        <option value="month">최근 30일</option>
      </select>

      <select id="sort" aria-label="정렬 선택">
        <option value="recommended">추천순</option>
        <option value="latest" selected>최신순</option>
        <option value="oldest">오래된 순</option>
      </select>
    </section>

    <div class="result-line">
      <span>
        표시 기사 <b id="shown-count">—</b>개 /
        저장 기사 <b id="total-count">—</b>개
      </span>
      <span id="status-note"></span>
    </div>

    <section>
      <div class="section-head">
        <div class="section-title">AI 브리핑</div>

        <div class="brief-actions">
          <button class="brief-button" id="brief-week">주간 요약</button>
          <button class="brief-button" id="brief-month">월간 요약</button>
          <button class="brief-button" id="brief-copy">프롬프트 복사</button>
        </div>
      </div>

      <div class="brief-box" id="brief-box"></div>
    </section>

    <section>
      <div class="section-head">
        <div class="section-title">저장된 기사</div>
      </div>

      <div class="grid" id="article-grid"></div>
      <button class="more" id="more">기사 더 보기 ↓</button>
    </section>
  </main>

  <footer>
    <strong>Content IP Radar</strong><br>
    Supabase에 저장된 콘텐츠 IP 뉴스를 불러와 표시합니다.
  </footer>

  <script>
    const $ = id => document.getElementById(id);

    let articles = [];
    let selectedCategory = "전체";
    let visibleLimit = 24;
    let loading = false;
    let currentPage = 1;
    let hasMorePages = false;
    const PAGE_SIZE = 100;
    const TIER_RANK = { A: 3, B: 2, C: 1 };

    const SOURCE_TYPE_LABEL = {
      official: "공식 발표",
      news: "신뢰 매체",
      industry: "전문매체",
      community: "커뮤니티"
    };

    // 이 사이트는 한국어 기준입니다. 영문 등 한글이 아닌 기사 제목·요약은
    // /api/translate(Google 번역)로 한국어로 옮겨서 표시합니다.
    const translationCache = new Map();

    function collapseText(value) {
      return String(value ?? "").replace(/\s+/g, " ").trim().slice(0, 400);
    }

    function hasHangul(value) {
      return /[가-힣]/.test(String(value ?? ""));
    }

    // 한글이 전혀 없고 라틴 문자가 있으면 번역 대상으로 봅니다.
    function needsTranslation(value) {
      const text = collapseText(value);
      return Boolean(text) && !hasHangul(text) && /[A-Za-z]/.test(text);
    }

    async function callTranslate(texts) {
      const response = await fetch("/api/translate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texts, tl: "ko" }),
        signal: AbortSignal.timeout(20000)
      });

      if (!response.ok) {
        throw new Error("번역 요청 실패");
      }

      const data = await response.json();
      return Array.isArray(data.texts) ? data.texts : texts;
    }

    // 로드된 기사 중 한글이 아닌 제목·요약을 모아 한국어로 번역하고,
    // 원문은 originalTitle/originalSummary에 보관합니다. (이미 처리한 기사는 건너뜀)
    async function translateArticles(list) {
      const keys = new Set();

      list.forEach(article => {
        if (article.translated) return;

        if (needsTranslation(article.title)) {
          const key = collapseText(article.title);
          if (!translationCache.has(key)) keys.add(key);
        }

        if (needsTranslation(article.summary)) {
          const key = collapseText(article.summary);
          if (!translationCache.has(key)) keys.add(key);
        }
      });

      const pending = [...keys];

      // /api/translate는 한 번에 최대 80개까지 처리하므로 50개씩 나눠 보냅니다.
      for (let i = 0; i < pending.length; i += 50) {
        const chunk = pending.slice(i, i + 50);

        try {
          const translated = await callTranslate(chunk);
          chunk.forEach((original, index) => {
            translationCache.set(original, translated[index] || original);
          });
        } catch (error) {
          // 실패한 묶음은 원문 그대로 두고 다음 묶음을 계속 시도합니다.
          chunk.forEach(original => translationCache.set(original, original));
        }
      }

      list.forEach(article => {
        if (article.translated) return;

        let changed = false;

        if (needsTranslation(article.title)) {
          const key = collapseText(article.title);
          const value = translationCache.get(key);
          if (value && value !== article.title) {
            article.originalTitle = article.title;
            article.title = value;
            changed = true;
          }
        }

        if (needsTranslation(article.summary)) {
          const key = collapseText(article.summary);
          const value = translationCache.get(key);
          if (value && value !== article.summary) {
            article.originalSummary = article.summary;
            article.summary = value;
            changed = true;
          }
        }

        if (changed) article.translated = true;
      });

      render();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeUrl(value) {
      try {
        const url = new URL(String(value || ""));
        return ["http:", "https:"].includes(url.protocol) ? url.href : "#";
      } catch {
        return "#";
      }
    }

    function parseDate(value) {
      if (!value) return null;

      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function relativeTime(date) {
      if (!date) return "날짜 미상";

      const seconds = Math.floor((Date.now() - date.getTime()) / 1000);

      if (seconds < 3600) {
        return `${Math.max(1, Math.floor(seconds / 60))}분 전`;
      }

      if (seconds < 86400) {
        return `${Math.floor(seconds / 3600)}시간 전`;
      }

      if (seconds < 86400 * 7) {
        return `${Math.floor(seconds / 86400)}일 전`;
      }

      return date.toLocaleDateString("ko-KR");
    }

    function isFresh(article) {
      return article.date &&
        Date.now() - article.date.getTime() < 24 * 60 * 60 * 1000;
    }

    function normalizeArticle(article) {
      return {
        title: String(article.title || "").trim(),
        url: String(article.url || article.link || "").trim(),
        source: String(article.source || "출처 미상").trim(),
        summary: String(
          article.summary ||
          article.snippet ||
          article.description ||
          ""
        ).trim(),
        category: String(article.category || "미분류").trim(),
        imageUrl: String(article.image_url || article.imageUrl || "").trim(),
        keywords: Array.isArray(article.keywords) ? article.keywords : [],
        priority: Number.isFinite(article.priority) ? article.priority : 99,
        sourceTier: article.source_tier || null,
        sourceType: article.source_type || null,
        trendScore: Number.isFinite(article.trend_score) ? article.trend_score : 0,
        date: parseDate(
          article.published_at ||
          article.collected_at ||
          article.created_at
        )
      };
    }

    function showSkeleton() {
      $("article-grid").innerHTML = Array.from(
        { length: 6 },
        () => '<div class="skeleton"></div>'
      ).join("");

      $("more").style.display = "none";
    }

    function updateNavigation() {
      const categories = [
        "전체",
        ...new Set(articles.map(article => article.category))
      ];

      const nav = $("category-nav");
      nav.innerHTML = "";

      categories.forEach(category => {
        const button = document.createElement("button");
        button.textContent = category;
        button.classList.toggle("active", category === selectedCategory);

        button.addEventListener("click", () => {
          selectedCategory = category;
          visibleLimit = 24;
          updateNavigation();
          render();
        });

        nav.appendChild(button);
      });
    }

    function filteredArticles() {
      const query = $("search").value.trim().toLowerCase();
      const period = $("period").value;
      const sort = $("sort").value;
      const now = Date.now();

      let result = articles.filter(article => {
        if (
          selectedCategory !== "전체" &&
          article.category !== selectedCategory
        ) {
          return false;
        }

        const searchable = [
          article.title,
          article.summary,
          article.source,
          article.category,
          article.keywords.join(" ")
        ].join(" ").toLowerCase();

        if (query && !searchable.includes(query)) {
          return false;
        }

        if (period !== "all") {
          if (!article.date) return false;

          const limits = {
            day: 1,
            week: 7,
            month: 30
          };

          const limit = limits[period] * 86400000;

          if (now - article.date.getTime() > limit) {
            return false;
          }
        }

        return true;
      });

      result.sort((a, b) => {
        if (sort === "recommended") {
          if (a.priority !== b.priority) return a.priority - b.priority;

          const tierDiff = (TIER_RANK[b.sourceTier] || 0) - (TIER_RANK[a.sourceTier] || 0);
          if (tierDiff !== 0) return tierDiff;

          if (b.trendScore !== a.trendScore) return b.trendScore - a.trendScore;

          return (b.date?.getTime() || 0) - (a.date?.getTime() || 0);
        }

        const aTime = a.date?.getTime() || 0;
        const bTime = b.date?.getTime() || 0;

        return sort === "oldest"
          ? aTime - bTime
          : bTime - aTime;
      });

      return result;
    }

    function createCard(article) {
      const card = document.createElement("article");
      card.className = "card";

      const title = escapeHtml(article.title);
      const category = escapeHtml(article.category);
      const source = escapeHtml(article.source);
      const summary = escapeHtml(article.summary);
      const url = safeUrl(article.url);

      card.innerHTML = `
        <div class="badges">
          <span class="badge">${category}</span>
          ${article.sourceType && SOURCE_TYPE_LABEL[article.sourceType]
            ? `<span class="badge badge-${article.sourceType}">${SOURCE_TYPE_LABEL[article.sourceType]}</span>`
            : ''}
          ${isFresh(article)
            ? '<span class="badge fresh">신규</span>'
            : ''}
        </div>

        <h2>
          <a href="${url}" target="_blank" rel="noopener noreferrer">
            ${title}
          </a>
        </h2>

        ${summary
          ? `<p class="summary">${summary}</p>`
          : '<p class="summary">기사 요약이 없습니다.</p>'}

        <div class="card-foot">
          <span class="source">
            ${source} · ${escapeHtml(relativeTime(article.date))}
          </span>

          <a
            class="visit"
            href="${url}"
            target="_blank"
            rel="noopener noreferrer"
          >
            원문 보기 ↗
          </a>
        </div>
      `;

      return card;
    }

    function updateStats() {
      $("stat-total").textContent = articles.length;

      $("stat-fresh").textContent =
        articles.filter(isFresh).length;

      $("stat-sources").textContent =
        new Set(articles.map(article => article.source)).size;

      $("stat-categories").textContent =
        new Set(articles.map(article => article.category)).size;

      $("total-count").textContent = articles.length;
    }

    function render() {
      if (loading) return;

      const result = filteredArticles();
      const visible = result.slice(0, visibleLimit);
      const grid = $("article-grid");

      $("shown-count").textContent = result.length;
      grid.innerHTML = "";

      if (!result.length) {
        grid.innerHTML = `
          <div class="notice">
            조건에 맞는 기사가 없습니다.<br>
            검색어나 기간 설정을 바꿔보세요.
          </div>
        `;

        $("more").style.display = "none";
        return;
      }

      visible.forEach(article => {
        grid.appendChild(createCard(article));
      });

      if (result.length > visibleLimit || hasMorePages) {
        $("more").style.display = "block";
        $("more").textContent = result.length > visibleLimit
          ? `기사 더 보기 (${result.length - visibleLimit}개 남음) ↓`
          : "기사 더 보기 ↓";
      } else {
        $("more").style.display = "none";
      }
    }

    async function loadArticles() {
      if (loading) return;

      loading = true;
      $("refresh").disabled = true;
      $("status-note").textContent =
        "Supabase에서 기사를 불러오는 중…";

      showSkeleton();

      try {
        const response = await fetch(`/api/articles?page=1&limit=${PAGE_SIZE}`, {
          cache: "no-store",
          signal: AbortSignal.timeout(15000)
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error("기사 조회에 실패했습니다.");
        }

        articles = (data.articles || [])
          .map(normalizeArticle)
          .filter(article => article.title && article.url);

        currentPage = 1;
        hasMorePages = Boolean(data.hasMore);

        selectedCategory = "전체";
        visibleLimit = 24;

        updateNavigation();
        updateStats();

        $("updated").textContent =
          new Date().toLocaleString("ko-KR", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          });

        $("status-note").textContent =
          `저장 기사 ${articles.length}개를 불러왔습니다.`;

        // 영문 기사를 한국어로 번역해 다시 그립니다. (네트워크 작업이라 비동기)
        translateArticles(articles);

      } catch (error) {
        articles = [];

        updateNavigation();
        updateStats();

        $("status-note").textContent =
          "기사를 불러오지 못했습니다.";

        $("article-grid").innerHTML = `
          <div class="notice">
            Supabase 저장 기사를 불러오지 못했습니다.<br>
            잠시 후 새로고침을 눌러 다시 시도해 주세요.
          </div>
        `;

      } finally {
        loading = false;
        $("refresh").disabled = false;
        render();
      }
    }

    async function loadMoreFromServer() {
      if (loading || !hasMorePages) return;

      loading = true;
      $("more").disabled = true;

      try {
        const nextPage = currentPage + 1;
        const response = await fetch(`/api/articles?page=${nextPage}&limit=${PAGE_SIZE}`, {
          cache: "no-store",
          signal: AbortSignal.timeout(15000)
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error("추가 기사 조회에 실패했습니다.");
        }

        const existingUrls = new Set(articles.map(article => article.url));

        const fresh = (data.articles || [])
          .map(normalizeArticle)
          .filter(article =>
            article.title &&
            article.url &&
            !existingUrls.has(article.url)
          );

        articles = [...articles, ...fresh];
        currentPage = nextPage;
        hasMorePages = Boolean(data.hasMore);

        updateNavigation();
        updateStats();

        // 새로 불러온 기사 중 영문 기사를 번역합니다.
        translateArticles(articles);

      } catch (error) {
        $("status-note").textContent = "추가 기사를 불러오지 못했습니다.";

      } finally {
        loading = false;
        $("more").disabled = false;
        render();
      }
    }

    async function loadStatus() {
      const badge = $("status-badge");
      badge.textContent = "확인 중…";
      badge.className = "status-badge";

      try {
        const response = await fetch("/api/status", {
          cache: "no-store",
          signal: AbortSignal.timeout(8000)
        });

        const data = await response.json();
        const ok = Boolean(data.success && data.supabaseConnected);

        badge.textContent = ok ? "정상" : "오류";
        badge.classList.add(ok ? "ok" : "err");

        $("status-supabase").textContent = ok ? "정상" : "오류";

        $("status-total").textContent =
          typeof data.totalArticles === "number" ? data.totalArticles : "—";

        $("status-last-collected").textContent = data.lastCollectedAt
          ? relativeTime(parseDate(data.lastCollectedAt))
          : "기록 없음";

        $("status-checked").textContent = data.checkedAt
          ? new Date(data.checkedAt).toLocaleString("ko-KR", {
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit"
            })
          : "—";

      } catch (error) {
        badge.textContent = "오류";
        badge.classList.add("err");

        $("status-supabase").textContent = "오류";
        $("status-total").textContent = "—";
        $("status-last-collected").textContent = "—";

        $("status-checked").textContent =
          new Date().toLocaleString("ko-KR", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          });
      }
    }

    function briefingItems(days) {
      const cutoff = Date.now() - days * 86400000;

      return articles
        .filter(article =>
          article.date &&
          article.date.getTime() >= cutoff
        )
        .slice(0, 100)
        .map(article => ({
          category: article.category,
          title: article.title,
          source: article.source
        }));
    }

    function briefingPrompt(days, label) {
      const items = briefingItems(days);

      const list = items
        .map(item =>
          `- [${item.category}] ${item.title} (${item.source})`
        )
        .join("\n");

      return [
        "당신은 콘텐츠 IP·스톡 미디어·AI 권리 분야 전문 애널리스트입니다.",
        `아래는 최근 ${label} 동안 수집된 기사입니다.`,
        "",
        list,
        "",
        "다음 형식으로 한국어 브리핑을 작성하세요.",
        "1. 전체 흐름",
        "2. 주요 이슈 4~6개",
        "3. 콘텐츠 IP 업계의 시사점",
        "기사에 없는 사실은 만들지 마세요."
      ].join("\n");
    }

    async function makeBrief(days, period, label) {
      const items = briefingItems(days);
      const box = $("brief-box");

      box.style.display = "block";

      if (!items.length) {
        box.textContent =
          `${label}에 해당하는 저장 기사가 없습니다.`;
        return;
      }

      $("brief-week").disabled = true;
      $("brief-month").disabled = true;
      box.textContent = `${label} 브리핑을 생성하는 중…`;

      try {
        const response = await fetch("/api/summarize", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            period,
            items
          }),
          signal: AbortSignal.timeout(60000)
        });

        const data = await response.json();

        if (!response.ok || !data.text) {
          throw new Error("요약 생성 실패");
        }

        box.textContent = data.text;

      } catch (error) {
        box.textContent =
          "자동 요약을 생성하지 못했습니다. 프롬프트 복사를 이용해 주세요.";

      } finally {
        $("brief-week").disabled = false;
        $("brief-month").disabled = false;
      }
    }

    $("refresh").addEventListener("click", () => {
      loadArticles();
      loadStatus();
    });

    $("search").addEventListener("input", () => {
      visibleLimit = 24;
      render();
    });

    $("period").addEventListener("change", () => {
      visibleLimit = 24;
      render();
    });

    $("sort").addEventListener("change", () => {
      visibleLimit = 24;
      render();
    });

    $("more").addEventListener("click", () => {
      const result = filteredArticles();

      if (visibleLimit < result.length) {
        visibleLimit += 24;
        render();
        return;
      }

      if (hasMorePages) {
        visibleLimit += 24;
        loadMoreFromServer();
      }
    });

    $("brief-week").addEventListener("click", () => {
      makeBrief(7, "week", "최근 7일");
    });

    $("brief-month").addEventListener("click", () => {
      makeBrief(30, "month", "최근 30일");
    });

    $("brief-copy").addEventListener("click", async () => {
      const box = $("brief-box");
      box.style.display = "block";

      if (!articles.length) {
        box.textContent = "복사할 기사가 없습니다.";
        return;
      }

      try {
        await navigator.clipboard.writeText(
          briefingPrompt(7, "7일")
        );

        box.textContent =
          "주간 브리핑 프롬프트를 복사했습니다. AI 채팅창에 붙여넣으세요.";

      } catch (error) {
        box.textContent =
          "복사하지 못했습니다. 브라우저의 클립보드 권한을 확인해 주세요.";
      }
    });

    loadArticles();
    loadStatus();

    setInterval(() => {
      loadArticles();
      loadStatus();
    }, 5 * 60 * 1000);
  </script>
</body>
</html>
